id = "herdr.glance"
name = "Glance"
version = "0.1.3"
min_herdr_version = "0.8.0"
description = "Always-on-top visibility into active Herdr agents"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release", "--package", "herdr-glance-app"]

[[actions]]
id = "open"
title = "Open Glance"
command = ["sh", "scripts/open-plugin.sh"]
